<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments</title>

  <link rel="stylesheet" href="style.css">
  <!-- ربط ملف التصميم الأساسي للصفحة -->

  <script src="Script.js"></script>
  <!-- ربط ملف الجافاسكريبت اللي فيه منطق عرض وحذف المواعيد -->

  <script>
    if(localStorage.getItem("theme")==="dark")
      document.documentElement.classList.add("dark-mode");
  </script>
  <!-- تفعيل الوضع الداكن لو كان المستخدم مختاره قبل كده -->
</head>

<body>

 <nav>
     <!-- اللوجو + اسم المعمل -->
     <!-- عند الضغط عليه يتم استدعاء دالة goHome() للذهاب للصفحة الرئيسية حسب اللغة -->
     <a href="#" class="logo" onclick="goHome()">
       <!-- صورة اللوجو -->
       <img src="logo.png" alt="BioScan Logo">
       <!-- اسم الموقع / المعمل -->
       <span>BioScan</span>
     </a>

    <!-- checkbox مخفي للتحكم في فتح وغلق القائمة في الموبايل -->
    <input type="checkbox" id="menu-toggle">

    <!-- زر الهامبرجر (☰) اللي بيظهر في الموبايل -->
    <!-- مرتبط بالـ checkbox فوق عن طريق for -->
    <label for="menu-toggle" class="hamburger">☰</label>

    <!-- قائمة الروابط الأساسية -->
    <ul>

        <!-- رابط الصفحة الرئيسية -->
        <li><a href="home.html">Home</a></li>

        <!-- صفحة الخدمات -->
        <li><a href="services.html">Services</a></li>

        <!-- صفحة التحاليل والأسعار -->
        <li><a href="tests.html">Tests & Prices</a></li>

        <!-- صفحة النتائج -->
        <li><a href="results.html">Results</a></li>

        <!-- صفحة التواصل -->
        <li><a href="contact.html">Contact</a></li>

        <!-- صفحة عن المعمل -->
        <li><a href="about.html">About</a></li>

        <!-- صفحة تسجيل الدخول -->
        <li><a href="login.html">Login</a></li>

        <!-- زر تغيير اللغة إلى العربية -->
        <!-- عند الضغط يتم استدعاء switchToArabic() -->
        <li>
            <a href="#" class="lang-switch" onclick="switchToArabic()">
                عربي 🌐
            </a>
        </li>

        <!-- زرار الثيم (Dark / Light Mode) -->
        <li>
            <label class="switch">
                <!-- checkbox للتحكم في الوضع الليلي -->
                <input type="checkbox" id="theme-toggle">

                <!-- شكل السلايدر (زر التحويل) -->
                <span class="slider">

                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>

                </span>
            </label>
        </li>

    </ul>
</nav>

  <header class="header">
    <h1>Your Booked Appointments</h1>
  </header>

  <main style="padding: 20px 5%;">

    <div id="appointment-list" class="card">
        <!-- هنا الجافاسكريبت هيعرض كل المواعيد المحفوظة -->
    </div>

    <button onclick="localStorage.removeItem('myAppointments'); location.reload();"
            style="background: red; margin-top: 20px; color: white;">
      Clear All Appointments
    </button>
    <!-- زرار لمسح كل المواعيد من localStorage وإعادة تحميل الصفحة -->

  </main>

</body>
</html>
