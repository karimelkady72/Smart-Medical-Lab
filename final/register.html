<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  
  <!-- استدعاء ملف الجافاسكريبت والستايل مظبوطين -->
  <script src="Script.js"></script>
  <link rel="stylesheet" href="style.css">
  
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
</head>
<body>

  <!-- الناف بار -->
  <nav>
     <!-- اللوجو + اسم المعمل -->
     <!-- عند الضغط عليه يتم استدعاء دالة goHome() للذهاب للصفحة الرئيسية حسب اللغة -->
     <a href="#" class="logo" onclick="goHome()">
       <!-- صورة اللوجو -->
       <img src="logo.png" alt="BioScan Logo">
       <!-- اسم الموقع / المعمل -->
       <span>BioScan</span>
     </a>

    <!-- checkbox مخفي للتحكم في فتح وغلق القائمة في الموبايل -->
    <input type="checkbox" id="menu-toggle">

    <!-- زر الهامبرجر (☰) اللي بيظهر في الموبايل -->
    <!-- مرتبط بالـ checkbox فوق عن طريق for -->
    <label for="menu-toggle" class="hamburger">☰</label>

    <!-- قائمة الروابط الأساسية -->
    <ul>

        <!-- رابط الصفحة الرئيسية -->
        <li><a href="home.html">Home</a></li>

        <!-- صفحة الخدمات -->
        <li><a href="services.html">Services</a></li>

        <!-- صفحة التحاليل والأسعار -->
        <li><a href="tests.html">Tests & Prices</a></li>

        <!-- صفحة النتائج -->
        <li><a href="results.html">Results</a></li>

        <!-- صفحة التواصل -->
        <li><a href="contact.html">Contact</a></li>

        <!-- صفحة عن المعمل -->
        <li><a href="about.html">About</a></li>

        <!-- صفحة تسجيل الدخول -->
        <li><a href="login.html">Login</a></li>

        <!-- زر تغيير اللغة إلى العربية -->
        <!-- عند الضغط يتم استدعاء switchToArabic() -->
        <li>
            <a href="#" class="lang-switch" onclick="switchToArabic()">
                عربي 🌐
            </a>
        </li>

        <!-- زرار الثيم (Dark / Light Mode) -->
        <li>
            <label class="switch">
                <!-- checkbox للتحكم في الوضع الليلي -->
                <input type="checkbox" id="theme-toggle">

                <!-- شكل السلايدر (زر التحويل) -->
                <span class="slider">

                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>

                </span>
            </label>
        </li>

    </ul>
</nav>

  <div class="container">
    <!-- الجزء الشمال -->
    <div class="left">
      <div class="overlay">
        <h1>Create Your Account</h1>
        <p>Join us and start managing your healthcare services easily.</p>
        <div class="features">
          <div class="box">Secure System</div>
          <div class="box">Easy Access</div>
        </div>
      </div>
    </div>

    <!-- الجزء اليمين (الفورم) -->
    <div class="right">
      <h2>Register</h2>
      <p class="sub">Create a new account</p>
      
      <!-- بعد ما يملى البيانات هيروح لصفحة التفعيل اللي عملناها -->
      <form id="register-form" action="verify.html">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" id="reg-password" placeholder="Password" required>
    <input type="password" id="reg-confirm" placeholder="Confirm Password" required>
    
    <div class="phone-input-container">
        <select id="country-code" onchange="updatePhoneLimit()">
            <option value="+20" data-len="11">🇪🇬 +20</option>
            <option value="+966" data-len="9">🇸🇦 +966</option>
            <option value="+971" data-len="9">🇦🇪 +971</option>
            <option value="+965" data-len="8">🇰🇼 +965</option>
        </select>
        <input type="tel" id="phone-number" placeholder="Phone Number" maxlength="11" minlength="11" required>
    </div>
    <button type="submit">Create Account</button>
</form>
      <!-- تحويل لصفحة اللوجن لو هو عنده حساب -->
      <div class="switch">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>

</body>
</html>
