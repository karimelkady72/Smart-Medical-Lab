<!-- الجزء اللي فوق في الصفحة اللي بيشرح الهدف منها -->
<div class="page-header">
  <h1>Lab Results</h1>
  <p>Enter your booking ID or name to view and download your results</p>
</div>

<main>

  <!-- كارت البحث اللي المستخدم بيكتب فيه بياناته عشان يجيب النتيجة -->
  <div class="search-card">

    <h2>Search for your result</h2>

    <!-- هنا المستخدم بيحط بيانات البحث سواء ID أو الاسم -->
    <div class="input-row">

      <!-- البحث عن طريق رقم الحجز لأنه أدق -->
      <div class="field">
        <label>Booking ID</label>
        <input type="text" id="booking-id" placeholder="Example: NL-2024-0891" />
      </div>

      <!-- بديل لو المستخدم مش عارف الـ ID -->
      <div class="field">
        <label>Or Patient Name</label>
        <input type="text" id="patient-name" placeholder="Full name" />
      </div>

      <!-- زرار بيشغل دالة جافاسكربت تدور على النتيجة -->
      <button class="btn-search" onclick="searchResult()">View Result</button>

    </div>

    <!-- رسالة بتظهر لو مفيش نتيجة أو البيانات غلط -->
    <div id="error-msg">No result found. Please check your data.</div>

  </div>

  <!-- أزرار التعامل مع النتيجة بعد ما تظهر -->
  <div class="action-row">

    <!-- بيحول النتيجة لصفحة طباعة / PDF -->
    <button class="btn-pdf" onclick="printPage()">Download PDF</button>

    <!-- بيعمل نسخ للينك أو مشاركة النتيجة -->
    <button class="btn-share" onclick="alert('Link copied!')">Share</button>

    <!-- بيطبع الصفحة مباشرة من المتصفح -->
    <button class="btn-share" onclick="window.print()">Print</button>

  </div>

</main>

<!-- الفوتر اللي فيه الحقوق -->
<footer>
  All rights reserved © 2026 | <span>Medical Lab</span>
</footer>

</body>
</html>
