<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="L&R.css">
</head>
<body>

<div class="container">

       <!-- دا شغل الجزء الشمال من الصفحه -->


    <div class="left">
        <div class="overlay">
            <h1>Welcome to the Future of Healthcare</h1>
            <p>
                We combine precision and advanced technology to deliver accurate lab results
                in a safe and reliable environment.
            </p>

            <div class="features">
                <div class="box">Fast Results</div>
                <div class="box">Advanced Technology</div>
            </div>
        </div>
    </div>

    <!-- دا شغل الجزء اليمين من الصفحه -->


    <div class="right">
        <h2>Login</h2>
        <p class="sub">Access your account  easily</p>

        <form>
            <input type="email" placeholder="Email or Phone">
            <input type="password" placeholder="Password">
            

            <button>Login</button>
        </form>

        <div class="switch">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

</div>

</html>
