<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="L&R.css">
</head>
<body>

<div class="container">

    <!-- دا شغل الجزء الشمال من الصفحه -->


    <div class="left">
        <div class="overlay">
            <h1>Create Your Account</h1>
            <p>
                Join us and start managing your healthcare services easily.
            </p>

            <div class="features">
                <div class="box">Secure System</div>
                <div class="box">Easy Access</div>
            </div>
        </div>
    </div>

      <!-- دا شغل الجزء اليمين من الصفحه -->


    <div class="right">
        <h2>Register</h2>
        <p class="sub">Create a new account</p>

        <form>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
            <input type="tel" placeholder="Phone Number">

            <button>Create Account</button>
        </form>

        <div class="switch">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

</body>
</html>
